<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ef7d22">
  <meta name="description" content="Instagramのお気に入り投稿を保存・管理">
  <meta name="referrer" content="no-referrer">
  <title>Recipe Saver</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="container">
    <header class="header"><h1>Recipe-Saver</h1></header>
    <section class="account-section" aria-label="ログイン">
      <p id="authStatus" role="status">アプリを読み込んでいます…</p>
      <button id="loginButton" type="button" class="primary" hidden>Googleでログイン</button>
      <button id="logoutButton" type="button" hidden>ログアウト</button>
      <noscript>このアプリを利用するにはJavaScriptを有効にしてください。</noscript>
    </section>
    <div id="appContent" hidden>
      <section class="input-section" aria-labelledby="newHeading">
        <h2 id="newHeading" class="input-heading">投稿を追加</h2>
        <form id="newForm">
          <fieldset id="newFields" disabled>
            <div class="input-group">
              <label for="postUrl">Instagram投稿URL（任意）</label>
              <input type="url" id="postUrl" maxlength="2048" placeholder="https://instagram.com/p/ABC123...">
            </div>
            <div class="input-group">
              <label for="imageInput">スクリーンショット画像（任意）</label>
              <button type="button" id="uploadArea" class="upload-area">
                <span>画像を選ぶ</span>
                <span class="upload-hint">ドラッグ＆ドロップも可・10MB以下</span>
              </button>
              <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
              <div id="imagePreview" hidden>
                <img id="previewImg" alt="選択した画像のプレビュー">
                <button id="clearImageButton" type="button">画像を取り消す</button>
                <button id="readTextButton" type="button" class="read-text-button">画像から文字を読み取る</button>
                <p id="ocrStatus" class="ocr-status" role="status" hidden></p>
              </div>
            </div>
            <div class="input-group">
              <label for="category">カテゴリ</label>
              <select id="category"><option value="">選択してください</option></select>
            </div>
            <div class="input-group">
              <label for="memo">メモ</label>
              <textarea id="memo" maxlength="10000" placeholder="メモを入力してください"></textarea>
            </div>
            <div class="button-group">
              <button type="submit" id="saveNewButton" class="primary">保存する</button>
              <button type="button" id="clearFormButton">クリア</button>
            </div>
          </fieldset>
        </form>
      </section>
      <section class="recipes-section" aria-labelledby="savedHeading">
        <div class="recipes-header">
          <h2 id="savedHeading">保存済み投稿</h2>
          <div id="recipeCount" class="recipe-count" role="status">0件</div>
        </div>
        <fieldset id="filterFields" disabled>
          <div class="search-box">
            <label for="searchInput">投稿を検索</label>
            <input type="search" id="searchInput" placeholder="メモ・URL・カテゴリで検索">
          </div>
          <div class="filter-select-wrap">
            <label for="categoryFilterSelect">カテゴリで絞り込む</label>
            <div class="filter-select-row">
              <select id="categoryFilterSelect" class="category-filter-select">
                <option value="">すべて</option><option value="favorites">お気に入り</option>
              </select>
              <button id="manageCategoriesButton" type="button" class="chip-btn gear-button" aria-label="カテゴリを編集" title="カテゴリを編集"></button>
            </div>
          </div>
        </fieldset>
        <div id="recipesGrid" class="recipes-grid"></div>
      </section>
    </div>
    <footer class="site-footer">© 2026 RECIPE SAVER. All rights reserved.</footer>
  </main>
  <dialog id="detailModal" class="modal detail-modal" aria-labelledby="detailHeading">
    <div class="modal-content">
      <div class="detail-header">
        <h2 id="detailHeading" class="modal-header">投稿の詳細</h2>
        <button id="detailClose" type="button" class="modal-close" aria-label="詳細画面を閉じる" autofocus>×</button>
      </div>
      <p id="detailCategory" class="detail-category"></p>
      <div id="detailImage" class="detail-image"></div>
      <a id="detailImageLink" class="text-link" target="_blank" rel="noopener noreferrer" hidden>画像を別タブで拡大 ↗</a>
      <h3 class="detail-memo-heading">メモ</h3>
      <p id="detailMemo" class="detail-memo"></p>
      <div class="modal-actions detail-actions">
        <button id="detailEdit" type="button" class="primary">編集する</button>
        <a id="detailSource" class="source-link" target="_blank" rel="noopener noreferrer" hidden>元の投稿を開く ↗</a>
        <button id="detailDone" type="button">閉じる</button>
      </div>
    </div>
  </dialog>
  <dialog id="editModal" class="modal" aria-labelledby="editHeading">
    <div class="modal-content">
      <button id="modalClose" type="button" class="modal-close" aria-label="編集画面を閉じる">×</button>
      <h2 id="editHeading" class="modal-header">投稿を編集</h2>
      <form id="editForm">
        <fieldset id="modalFields">
          <div id="modalThumbnail" class="thumbnail-preview no-image"></div>
          <div class="input-group">
            <label for="modalImageInput">画像を追加・変更（任意）</label>
            <button id="modalUploadArea" type="button" class="modal-upload-area">
              <span>ドラッグ&amp;ドロップまたはクリック</span>
              <span class="upload-hint">JPEG・PNG・WebP・GIF、10MB以下</span>
            </button>
            <input id="modalImageInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
            <button id="modalReadTextButton" type="button" class="read-text-button" hidden>画像から文字を読み取ってメモに入れる</button>
            <p id="modalOcrStatus" class="ocr-status" role="status" hidden></p>
          </div>
          <div class="input-group">
            <label for="modalPostUrl">Instagram投稿URL（任意）</label>
            <input type="url" id="modalPostUrl" maxlength="2048" placeholder="https://instagram.com/p/ABC123...">
          </div>
          <div class="input-group">
            <label for="modalCategory">カテゴリ</label>
            <select id="modalCategory"><option value="">選択してください</option></select>
          </div>
          <div class="input-group">
            <label for="modalMemo">メモ</label>
            <textarea id="modalMemo" maxlength="10000"></textarea>
          </div>
          <div class="modal-actions">
            <button id="saveEditButton" type="submit" class="primary">保存</button>
            <button id="cancelEditButton" type="button">キャンセル / 閉じる</button>
          </div>
        </fieldset>
      </form>
    </div>
  </dialog>
  <dialog id="categoryModal" class="modal" aria-labelledby="categoryHeading">
    <div class="modal-content">
      <button id="categoryClose" type="button" class="modal-close" aria-label="カテゴリ編集を閉じる">×</button>
      <h2 id="categoryHeading" class="modal-header">カテゴリを編集</h2>
      <form id="categoryForm">
        <fieldset id="categoryFields">
          <p class="category-hint">名前の変更、↑↓ボタンで並べ替え、ゴミ箱ボタンで削除ができます。削除したカテゴリの投稿は「その他」として表示されます。</p>
          <ul id="categoryList" class="category-list"></ul>
          <div class="input-group">
            <label for="categoryAddInput">カテゴリを追加</label>
            <div class="category-add">
              <input type="text" id="categoryAddInput" maxlength="20" placeholder="新しいカテゴリ名（20文字まで）">
              <button id="categoryAddButton" type="button">追加</button>
            </div>
          </div>
          <div class="modal-actions">
            <button id="categorySaveButton" type="submit" class="primary">保存</button>
            <button id="categoryCancelButton" type="button">キャンセル</button>
          </div>
        </fieldset>
      </form>
    </div>
  </dialog>
  <div id="customToast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/main.mjs"></script>
</body>
</html>
